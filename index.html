<!DOCTYPE html>

    <title>Aurenex</title>
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && event.reason.message.includes('WebSocket')) {
          event.preventDefault();
        }
      });
      const originalError = console.error;
      console.error = function(...args) {
          if (typeof args[0] === 'string' && args[0].includes('[vite] failed to connect to websocket')) {
              return;
          }
          originalError.apply(console, args);
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {

              secondary: {

      /* Ensure display equations are centered within the chat bubble's text flow */
      .prose .katex-display {

          justify-content: center;
      }
      /* Give inline KaTeX room for subscripts/superscripts without overlapping adjacent lines.
         KaTeX uses strut-based positioning internally with its own line-height: 1.2.
         We must NOT override .katex's own line-height or vertical-align, as that
         breaks internal superscript/subscript placement (vlist positioning).
         We only increase the surrounding text line-height so struts don't clip. */
      .prose p, .prose li {

      .source-context {

      }
      
      .source-context strong {
          color: hsl(var(--primary));
          font-weight: 700;
      }

  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script>
      function setupMermaid() {
        if (!window.mermaid) return;
        const isDark = document.documentElement.classList.contains('dark');
        window.mermaid.initialize({
          startOnLoad: false,
          theme: isDark ? 'dark' : 'default',
          securityLevel: 'loose',
          fontFamily: 'Inter, sans-serif',
          flowchart: {
            htmlLabels: false
          }
        });
      }
      setupMermaid();

      const observer = new MutationObserver((mutations) => {
        for(const mutation of mutations) {
            if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                setupMermaid();
                // If diagrams are already on screen, re-render them
                if (window.mermaid) {
                  setTimeout(() => {
                    window.mermaid.run({ nodes: document.querySelectorAll('.mermaid') }).catch(e => {
                        const errorMessage = window.getMermaidErrorMessage ? window.getMermaidErrorMessage(e) : e;
                        console.error("Mermaid re-run error:", errorMessage);
                    });
                  }, 100);
                }
            }
        }
      });
      observer.observe(document.documentElement, { attributes: true });

      // --- Robust Dynamic Content Rendering ---
      window.katexLoaded = false;
      const renderQueue = [];
      
      window.processRenderQueue = function() {
        if (window.katexLoaded && window.renderMathInElement) {
          while(renderQueue.length > 0) {
            const element = renderQueue.shift();
            try {
              window.renderMathInElement(element, {
                delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', display: false},
                  {left: '\\(', right: '\\)', display: false},
                  {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError : false
              });
            } catch (e) {
              console.error("KaTeX rendering error:", e);
            }
          }
        }
      }

      // Global function for rendering dynamic content like Mermaid and LaTeX
      window.renderDynamicContent = function(element) {
        if (!element) return;
        renderQueue.push(element);
        window.processRenderQueue();
      }
    </script>
